name: Security validation

on:
  push:
    branches: [main, "security/**", "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automated-tests-and-dependency-audit:
    name: Typecheck, tests, builds, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Server TypeScript check
        working-directory: server
        run: npm run typecheck
      - name: Smoke-test Drizzle Kit config loading
        working-directory: server
        run: npm run db:generate
      # The app-hosting test serves client/dist, so build it before running tests.
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build client for production
        working-directory: client
        run: npm run build
      - name: Run all server tests
        working-directory: server
        run: npm test
      - name: Audit root dependencies
        if: always()
        run: npm audit --audit-level=moderate
      - name: Audit server dependencies
        if: always()
        working-directory: server
        run: npm audit --audit-level=moderate
      - name: Audit client dependencies
        if: always()
        working-directory: client
        run: npm audit --audit-level=moderate

  codeql:
    name: CodeQL JavaScript and TypeScript analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
