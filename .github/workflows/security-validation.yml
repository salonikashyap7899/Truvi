name: Security validation

on:
  push:
    branches: [main, "security/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  automated-tests-and-dependency-audit:
    name: Typecheck, tests, builds, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Do not leave the write-capable token in .git/config while executing
          # package lifecycle scripts or other repository-controlled code.
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Server TypeScript check
        working-directory: server
        run: npm run typecheck
      - name: Smoke-test Drizzle Kit config loading
        working-directory: server
        run: npm run db:generate
      # The app-hosting test serves client/dist, so build it before running tests.
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Lint client code
        working-directory: client
        run: npm run lint
      - name: Build client for production
        working-directory: client
        run: npm run build
      - name: Run all server tests
        working-directory: server
        run: npm test
      - name: Audit root dependencies
        if: always()
        run: npm audit --audit-level=moderate
      - name: Audit server dependencies
        if: always()
        working-directory: server
        run: npm audit --audit-level=moderate
      - name: Audit client dependencies
        if: always()
        working-directory: client
        run: npm audit --audit-level=moderate
      - name: Refresh browser QA lockfile with compatible fixes
        if: (github.event_name == 'pull_request' && github.head_ref == 'fix/full-repo-payment-and-marketplace-audit') || (github.event_name == 'push' && github.ref_name == 'fix/full-repo-payment-and-marketplace-audit')
        working-directory: truvi-tests
        run: npm audit fix --package-lock-only --no-fund
      - name: Install browser QA dependencies
        working-directory: truvi-tests
        run: npm ci
      - name: Smoke-test browser QA tooling imports
        working-directory: truvi-tests
        run: node --input-type=module -e "await import('lighthouse'); await import('puppeteer-core'); await import('chromium-bidi');"
      - name: Audit browser QA dependencies
        if: always()
        working-directory: truvi-tests
        run: npm audit --audit-level=moderate
      - name: Commit refreshed browser QA lockfile
        if: always() && ((github.event_name == 'pull_request' && github.head_ref == 'fix/full-repo-payment-and-marketplace-audit' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref_name == 'fix/full-repo-payment-and-marketplace-audit'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add truvi-tests/package-lock.json
          if git diff --cached --quiet; then
            echo "No browser QA lockfile changes to commit."
            exit 0
          fi
          git commit -m "security: refresh browser QA dependency lockfile"
          TARGET_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          AUTH_REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch "${AUTH_REPO_URL}" "refs/heads/${TARGET_REF}:refs/remotes/origin/${TARGET_REF}"
          git rebase "refs/remotes/origin/${TARGET_REF}"
          git push "${AUTH_REPO_URL}" "HEAD:refs/heads/${TARGET_REF}"

  codeql:
    name: CodeQL JavaScript and TypeScript analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
