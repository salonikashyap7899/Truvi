name: Security validation

on:
  push:
    branches: [main, "security/**", "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  automated-tests-and-dependency-audit:
    name: Typecheck, tests, builds, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Refresh root lockfile with compatible security fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'security/dependency-audit-fix'
        continue-on-error: true
        run: npm audit fix --package-lock-only --no-fund
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Server TypeScript check
        working-directory: server
        run: npm run typecheck
      # Temporary remediation for PR #381 only. npm audit fix stays within
      # current semver ranges; never use --force and never upgrade major APIs.
      - name: Refresh backend lockfile with compatible security fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'security/dependency-audit-fix'
        continue-on-error: true
        working-directory: server
        run: npm audit fix --package-lock-only --no-fund
      - name: Refresh frontend lockfile with compatible security fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'security/dependency-audit-fix'
        continue-on-error: true
        working-directory: client
        run: npm audit fix --package-lock-only --no-fund
      # The app-hosting test serves client/dist, so build it before running tests.
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build client for production
        working-directory: client
        run: npm run build
      - name: Run all server tests
        working-directory: server
        run: npm test
      - name: Audit server dependencies
        if: always()
        working-directory: server
        run: npm audit --audit-level=high
      - name: Audit client dependencies
        if: always()
        working-directory: client
        run: npm audit --audit-level=high
      # The temporary dependency maintenance run commits lockfile results back
      # to its own same-repository branch so the pull request shows the fixes.
      - name: Commit refreshed security lockfiles
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'security/dependency-audit-fix' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json client/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "security: refresh patched dependency lockfiles"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"

  codeql:
    name: CodeQL JavaScript and TypeScript analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
