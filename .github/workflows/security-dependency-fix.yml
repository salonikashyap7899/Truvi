name: Refresh vulnerable npm dependencies

on:
  push:
    branches:
      - security/dependency-audit-fix

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply non-breaking npm audit fixes
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix server audit fix --no-fund
          npm --prefix client audit fix --no-fund
      - name: Typecheck and test backend
        working-directory: server
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Build frontend
        working-directory: client
        run: npm run build
      - name: Report remaining advisories
        shell: bash
        run: |
          set +e
          npm --prefix server audit --json > "$RUNNER_TEMP/server-audit.json"
          npm --prefix client audit --json > "$RUNNER_TEMP/client-audit.json"
          node - "$RUNNER_TEMP/server-audit.json" "$RUNNER_TEMP/client-audit.json" <<'NODE'
          const fs = require('node:fs');
          for (const file of process.argv.slice(2)) {
            let report;
            try { report = JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch { console.log(file + ': npm audit did not return parseable JSON'); continue; }
            const vulns = Object.values(report.vulnerabilities || {});
            const counts = report.metadata?.vulnerabilities || {};
            console.log(file.includes('server') ? 'SERVER AUDIT' : 'CLIENT AUDIT',
              JSON.stringify(counts));
            for (const item of vulns) {
              console.log('-', item.name, 'severity=' + item.severity,
                'range=' + item.range,
                'fixAvailable=' + JSON.stringify(item.fixAvailable));
            }
          }
          NODE
      - name: Commit updated manifests and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json client/package.json client/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were generated."
            exit 0
          fi
          git commit -m "security: update vulnerable npm dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
