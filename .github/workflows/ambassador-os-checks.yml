name: Ambassador Operating System checks

on:
  push:
    branches:
      - feat/ambassador-operating-system-pilot
  pull_request:
    branches:
      - main

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install backend dependencies and type-check
        run: |
          cd server
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Run Ambassador OS business-rule tests
        working-directory: server
        run: npx vitest run src/services/ambassadorOperatingSystem.rules.test.ts
      - name: Install frontend dependencies and build
        run: |
          cd client
          npm install --no-audit --no-fund
          npm run build
